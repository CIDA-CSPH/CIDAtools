[project]
name = "cidatools"
version = "2.0.0"
description = "CIDAtools implementation for Python"
readme = "README.md"
requires-python = ">=3.14"

dependencies = [
    "jinja2>=3.1.6",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.scripts]
cidatools = "cidatools.cli:cli"